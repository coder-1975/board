<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaching Cards</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #cba6f7;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .card-container {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 560px;
    }

    .card-container iframe {
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      height: 380px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Teaching Cards</h1>
  <div class="card-container">
    <iframe
      src="https://wordwall.net/embed/1c721611c57844528b59f215adaf21ea?themeId=41&templateId=46&fontStackId=0"
      width="500"
      height="380"
      frameborder="0"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
